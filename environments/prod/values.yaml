# Prod: more replicas and resources. Consider moving PostgreSQL to Amazon RDS
# (postgres.enabled=false + externalDatabase.host) and MinIO to Amazon S3.
# access.mode (address | domains) comes from the Jenkins ACCESS_MODE parameter.
# The domains and the certificate below are used only with ACCESS_MODE=domains.
domains:
  odoo: odoo.example.com
  keycloak: auth.example.com
  minioConsole: minio.example.com

ingress:
  certificateArn: arn:aws:acm:us-east-1:111122223333:certificate/REPLACE-ME

postgres:
  storage: 100Gi
  resources:
    requests: { cpu: "1", memory: 4Gi }
    limits: { memory: 8Gi }
  config: |
    max_connections = 300
    shared_buffers = 2GB
    effective_cache_size = 6GB
    work_mem = 16MB
    maintenance_work_mem = 512MB

minio:
  storage: 200Gi
  # Keep the MinIO console private in prod (use kubectl port-forward)
  console:
    ingress: false

keycloak:
  replicas: 2
  grafanaUrl: https://grafana.example.com   # domains mode only

odoo:
  workers: 6
  resources:
    requests: { cpu: "1", memory: 3Gi }
    limits: { memory: 4Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
