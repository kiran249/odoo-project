# Prod: more replicas and resources. Consider moving PostgreSQL to Amazon RDS
# (postgres.enabled=false + externalDatabase.host) and MinIO to Amazon S3.
domains:
  odoo: odoo.example.com
  keycloak: auth.example.com
  minioConsole: minio.example.com

ingress:
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/group.name: odoo-platform-prod
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:111122223333:certificate/REPLACE-ME

postgres:
  storage: 100Gi
  resources:
    requests: { cpu: "1", memory: 4Gi }
    limits: { memory: 8Gi }
  config: |
    max_connections = 300
    shared_buffers = 2GB
    effective_cache_size = 6GB
    work_mem = 16MB
    maintenance_work_mem = 512MB

minio:
  storage: 200Gi
  # Keep the MinIO console private in prod (use kubectl port-forward)
  console:
    ingress: false

keycloak:
  replicas: 2
  grafanaUrl: https://grafana.example.com

odoo:
  workers: 6
  resources:
    requests: { cpu: "1", memory: 3Gi }
    limits: { memory: 4Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
