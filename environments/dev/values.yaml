# Dev: everything in-cluster, single replicas, small volumes.
# access.mode (address | domains) comes from the Jenkins ACCESS_MODE parameter.
# The domains and the certificate below are used only with ACCESS_MODE=domains.
domains:
  odoo: odoo-dev.example.com
  keycloak: auth-dev.example.com
  minioConsole: minio-dev.example.com

ingress:
  certificateArn: arn:aws:acm:us-east-1:111122223333:certificate/REPLACE-ME

postgres:
  storage: 10Gi
  backup:
    retentionDays: 3

minio:
  storage: 20Gi

keycloak:
  grafanaUrl: https://grafana.example.com   # domains mode only

odoo:
  replicas: 1
  workers: 2
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 2Gi }
