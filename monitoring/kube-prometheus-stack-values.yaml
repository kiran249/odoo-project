# Cluster-wide monitoring (installed once, shared by every environment).
# Release name must stay "kube-prometheus-stack" (the app chart's labels match it).

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors/Probes/Rules from every namespace and release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 15d
    resources:
      requests: { cpu: 500m, memory: 2Gi }
      limits: { memory: 4Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
  # Add receivers (Slack, email, PagerDuty) here, e.g.:
  # config:
  #   route: { receiver: slack, group_by: [alertname, namespace] }
  #   receivers:
  #     - name: slack
  #       slack_configs: [{ api_url: https://hooks.slack.com/..., channel: "#alerts" }]

grafana:
  # admin credentials come from the "grafana-admin" secret (scripts/create-secrets.sh)
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: gp3
    size: 5Gi
  ingress:
    enabled: true
    ingressClassName: alb
    # Plain HTTP on port 80 of the ALB's own address (ACCESS_MODE=address).
    # kube-prometheus-stack-values-domains.yaml adds the hostname and HTTPS.
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
      alb.ingress.kubernetes.io/group.name: monitoring
    hosts: []
  envFromSecrets:
    - name: grafana-oidc   # provides GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
  # root_url and the Keycloak URLs are set by scripts/install-monitoring.sh
  # (from the ALB addresses, or from kube-prometheus-stack-values-domains.yaml).
  grafana.ini:
    # Single sign-on with Keycloak (realm "odoo", client "grafana").
    # Realm roles grafana-admin / grafana-editor map to Grafana roles.
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grafana
      scopes: openid email profile
      use_pkce: true
      role_attribute_path: contains(roles[*], 'grafana-admin') && 'Admin' || contains(roles[*], 'grafana-editor') && 'Editor' || 'Viewer'
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  # Community dashboards, downloaded by Grafana on start. Without "revision"
  # the chart fetches revision 1; set a newer revision you have checked exists.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: community
          folder: Odoo Platform
          type: file
          options:
            path: /var/lib/grafana/dashboards/community
  dashboards:
    community:
      postgresql:
        gnetId: 9628
        datasource: Prometheus
      minio:
        gnetId: 13502
        datasource: Prometheus
