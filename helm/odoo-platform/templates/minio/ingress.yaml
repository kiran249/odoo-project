{{- if and .Values.minio.enabled .Values.minio.console.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-console
  labels:
    {{- include "op.componentLabels" (list . "minio") | nindent 4 }}
  {{- include "op.ingressAnnotations" (list . (dict "alb.ingress.kubernetes.io/healthcheck-path" "/") .Values.access.ports.minioConsole) | nindent 2 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- include "op.ingressTls" (list . .Values.domains.minioConsole) | nindent 2 }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  name: console
      {{- include "op.ingressHost" (list . .Values.domains.minioConsole) | nindent 6 }}
{{- end }}
