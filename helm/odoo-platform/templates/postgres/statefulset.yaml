{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "op.componentLabels" (list . "postgres") | nindent 4 }}
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "op.selector" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "op.componentLabels" (list . "postgres") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/postgres/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        fsGroup: 999
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            {{- include "op.secretEnv" (list "POSTGRES_PASSWORD" "postgres-password" .) | nindent 12 }}
            {{- include "op.secretEnv" (list "ODOO_DB_PASSWORD" "odoo-db-password" .) | nindent 12 }}
            {{- include "op.secretEnv" (list "KEYCLOAK_DB_PASSWORD" "keycloak-db-password" .) | nindent 12 }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: config
              mountPath: /etc/postgresql/conf.d/platform.conf
              subPath: platform.conf
            - name: config
              mountPath: /docker-entrypoint-initdb.d/10-create-roles.sh
              subPath: 10-create-roles.sh
        - name: exporter
          image: {{ .Values.postgres.exporter.image }}
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_URI
              value: localhost:5432/postgres?sslmode=disable
            - name: DATA_SOURCE_USER
              value: postgres
            {{- include "op.secretEnv" (list "DATA_SOURCE_PASS" "postgres-password" .) | nindent 12 }}
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: config
          configMap:
            name: postgres-config
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
