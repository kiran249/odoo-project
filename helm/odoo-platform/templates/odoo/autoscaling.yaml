{{- if .Values.odoo.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: odoo
  labels:
    {{- include "op.componentLabels" (list . "odoo") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: odoo
  minReplicas: {{ .Values.odoo.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.odoo.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.odoo.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if or .Values.odoo.autoscaling.enabled (gt (int .Values.odoo.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: odoo
  labels:
    {{- include "op.componentLabels" (list . "odoo") | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "op.selector" (list . "odoo") | nindent 6 }}
{{- end }}
