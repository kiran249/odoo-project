{{- $extra := dict "alb.ingress.kubernetes.io/healthcheck-path" "/web/health" }}
{{- if .Values.odoo.stickySessions }}
{{- $_ := set $extra "alb.ingress.kubernetes.io/target-group-attributes" "stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=86400" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: odoo
  labels:
    {{- include "op.componentLabels" (list . "odoo") | nindent 4 }}
  {{- include "op.ingressAnnotations" (list . $extra 80) | nindent 2 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- include "op.ingressTls" (list . .Values.domains.odoo) | nindent 2 }}
  rules:
    - http:
        paths:
          # Real-time bus (chat, notifications) is served by the gevent worker
          - path: /websocket
            pathType: Prefix
            backend:
              service:
                name: odoo
                port:
                  name: websocket
          - path: /
            pathType: Prefix
            backend:
              service:
                name: odoo
                port:
                  name: http
      {{- include "op.ingressHost" (list . .Values.domains.odoo) | nindent 6 }}
