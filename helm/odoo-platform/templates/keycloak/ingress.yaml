{{- if .Values.keycloak.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  labels:
    {{- include "op.componentLabels" (list . "keycloak") | nindent 4 }}
  {{- include "op.ingressAnnotations" (list . (dict
      "alb.ingress.kubernetes.io/healthcheck-port" "9000"
      "alb.ingress.kubernetes.io/healthcheck-path" "/health/ready") .Values.access.ports.keycloak) | nindent 2 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- include "op.ingressTls" (list . .Values.domains.keycloak) | nindent 2 }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
      {{- include "op.ingressHost" (list . .Values.domains.keycloak) | nindent 6 }}
{{- end }}
